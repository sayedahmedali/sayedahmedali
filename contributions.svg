<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140" role="img" aria-label="Contributions snapshot placeholder">
  <style>
    .bg { fill: #ffffff }
    .title { font: 600 16px 'Segoe UI', Roboto, Arial; fill: #111827 }
    .subtitle { font: 400 12px 'Segoe UI', Roboto, Arial; fill: #6b7280 }
    .cell { fill: #e6e6e6; stroke: #fff }
    .cell-dark { fill: #16a34a }
  </style>
  <rect class="bg" width="100%" height="100%" rx="6"/>
  <text x="16" y="24" class="title">Contributions snapshot (placeholder)</text>
  <text x="16" y="44" class="subtitle">This file will be replaced automatically by the scheduled workflow with your real contributions graph.</text>

  <!-- Simple illustrative grid to mimic contribution blocks -->
  <g transform="translate(16,60)">
    <!-- 12 columns x 6 rows of cells -->
    <!-- draw columns -->
    <!-- Column spacing 12, cell size 10 -->
    <!-- We'll highlight some cells to resemble activity -->
    <!-- Row 0..5, Col 0..11 -->
    <!-- Light cells -->
    <g>
      <rect class="cell" x="0" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="12" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="24" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="36" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="48" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="60" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="72" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="84" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="96" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="108" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="120" y="0" width="10" height="10" rx="2" />
      <rect class="cell" x="132" y="0" width="10" height="10" rx="2" />

      <!-- Row 1 -->
      <rect class="cell" x="0" y="12" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="12" y="12" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="24" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="36" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="48" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="60" y="12" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="72" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="84" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="96" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="108" y="12" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="120" y="12" width="10" height="10" rx="2" />
      <rect class="cell" x="132" y="12" width="10" height="10" rx="2" />

      <!-- Row 2 -->
      <rect class="cell" x="0" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="12" y="24" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="24" y="24" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="36" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="48" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="60" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="72" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="84" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="96" y="24" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="108" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="120" y="24" width="10" height="10" rx="2" />
      <rect class="cell" x="132" y="24" width="10" height="10" rx="2" />

      <!-- Row 3 -->
      <rect class="cell" x="0" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="12" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="24" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="36" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="48" y="36" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="60" y="36" width="10" height="10" rx="2" />
      <rect class="cell-dark" x="72" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="84" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="96" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="108" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="120" y="36" width="10" height="10" rx="2" />
      <rect class="cell" x="132" y="36" width="10" height="10" rx="2" />

      <!-- Row 4 -->
      <rect class="cell" x="0" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="12" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="24" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="36" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="48" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="60" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="72" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="84" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="96" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="108" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="120" y="48" width="10" height="10" rx="2" />
      <rect class="cell" x="132" y="48" width="10" height="10" rx="2" />
    </g>

    <!-- Legend -->
    <g transform="translate(160,2)">
      <text x="0" y="10" font-size="11" fill="#374151">Less</text>
      <rect x="36" y="0" width="10" height="10" rx="2" fill="#ebf8ff" stroke="#fff" />
      <rect x="52" y="0" width="10" height="10" rx="2" fill="#bbf7d0" stroke="#fff" />
      <rect x="68" y="0" width="10" height="10" rx="2" fill="#34d399" stroke="#fff" />
      <rect x="84" y="0" width="10" height="10" rx="2" fill="#16a34a" stroke="#fff" />
      <text x="100" y="10" font-size="11" fill="#374151">More</text>
    </g>
  </g>
</svg>
